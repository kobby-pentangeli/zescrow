name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Skip compiling the RISC Zero zkVM guest, which requires the rzup-managed
  # toolchain; the host crates then build against stub method constants. The
  # guest is exercised by the dedicated proving job, not on every push.
  RISC0_SKIP_BUILD: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets --workspace -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit, integration, and target tests
        run: cargo test --all-features --all-targets --workspace
      - name: Doctests
        run: cargo test --all-features --doc --workspace

  build:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features --all-targets --workspace

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps --document-private-items --workspace

  # The Solana program is its own Anchor workspace, so it is not covered by the
  # workspace-wide jobs above. These host-target checks run without the Solana
  # platform toolchain; the on-chain build and program tests run separately.
  escrow-program:
    name: escrow program (host checks)
    runs-on: ubuntu-latest
    env:
      MANIFEST: agent/solana/escrow/programs/escrow/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/solana/escrow
      - run: cargo +nightly fmt --manifest-path "$MANIFEST" -- --check
      - run: cargo +stable clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - run: cargo +stable test --manifest-path "$MANIFEST"
