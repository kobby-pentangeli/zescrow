[package]
name = "mock_verifier"
version = "0.3.0"
description = "Test-only RISC Zero verifier stub for the Zescrow Solana program"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kobby-pentangeli/zescrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.2"

# Suppress lints triggered inside Anchor/Solana macro expansions (upstream issue)
[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
diverging_sub_expression = "allow"
