[package]
name = "escrow"
version = "0.3.0"
description = "Zescrow Solana program with XRPL-style time-lock semantics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kobby-pentangeli/zescrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.0.2"
sha2 = { version = "0.10", default-features = false }

# Suppress lints triggered inside Anchor/Solana macro expansions (upstream issue)
[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
diverging_sub_expression = "allow"
