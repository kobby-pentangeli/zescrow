[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
optimizer = true
optimizer_runs = 200
solc = "0.8.28"
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[soldeer]
remappings_generate = false

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
forge-std = "1.9.4"
