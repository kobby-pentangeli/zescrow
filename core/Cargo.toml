[package]
name = "zescrow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core library for Zescrow: zero-knowledge escrow transactions via RISC Zero zkVM"
documentation = "https://docs.rs/zescrow-core"
readme = "README.md"
keywords = ["zk", "zero-knowledge", "escrow", "risc-zero", "zkvm"]
categories = ["cryptography"]

[features]
default = ["bincode"]
bincode = []
json = ["serde", "serde_json", "serde_bytes", "serde_with"]

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6"
thiserror = { workspace = true }
bincode = { workspace = true }

serde = { workspace = true, optional = true }
serde_bytes = { version = "0.11", optional = true }
serde_json = { workspace = true, optional = true }
serde_with = { version = "3.12", features = ["hex"], optional = true }
